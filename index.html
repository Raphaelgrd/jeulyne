<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1626">
<title>Rousse en Ville</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1a1626;
    --panel: #2a2340;
    --ink: #fff6e0;
    --accent: #ff7a2f;
    --accent-dark: #b8461a;
    --muted: #b9a9d6;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    overflow: hidden; overscroll-behavior: none;
    font-family: 'Press Start 2P', monospace;
    -webkit-user-select: none; user-select: none;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #stage { position: relative; }
  canvas {
    display: block; width: 100%; height: 100%;
    image-rendering: pixelated; image-rendering: crisp-edges;
    touch-action: none;
  }
  .overlay {
    position: absolute; inset: 0;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 16px; gap: 18px;
    background: rgba(20, 16, 32, 0.78);
  }
  .overlay.show { display: flex; }
  h1 { font-size: clamp(16px, 5.4vmin, 28px); line-height: 1.5; margin: 0; color: var(--accent); text-shadow: 3px 3px 0 #000; }
  p { font-size: clamp(9px, 2.8vmin, 13px); line-height: 1.9; margin: 0; }
  .muted { color: var(--muted); }
  .snap {
    font-size: clamp(13px, 4.4vmin, 22px); color: #fffc00;
    background: #000; padding: 12px 14px; border: 4px solid #fffc00;
    box-shadow: 6px 6px 0 var(--accent-dark); word-break: break-all;
  }
  button {
    font-family: inherit; font-size: clamp(11px, 3.4vmin, 15px);
    color: var(--ink); background: var(--accent);
    border: 0; padding: 14px 18px; cursor: pointer;
    box-shadow: 0 6px 0 var(--accent-dark), 0 6px 0 4px #000;
    transform: translateY(0); transition: transform .06s, box-shadow .06s;
  }
  button:active { transform: translateY(6px); box-shadow: 0 0 0 var(--accent-dark), 0 0 0 4px #000; }
  button.ghost { background: var(--panel); box-shadow: 0 6px 0 #120e1c, 0 6px 0 4px #000; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game"></canvas>

    <div class="overlay show" id="start">
      <h1>ROUSSE<br>EN VILLE</h1>
      <p>Esquive <b>10 obstacles</b><br>dans la rue&nbsp;!</p>
      <p class="muted">Glisse ton doigt<br>à gauche / à droite</p>
      <button id="btnStart">JOUER</button>
    </div>

    <div class="overlay" id="over">
      <h1>AÏE&nbsp;!</h1>
      <p id="overText">Tu as esquivé 0 / 10</p>
      <button id="btnRetry">REJOUER</button>
    </div>

    <div class="overlay" id="win">
      <h1>BRAVO&nbsp;!</h1>
      <p>Vous avez obtenu<br>le snap de Raphaël&nbsp;:</p>
      <div class="snap">raphael_ger11</div>
      <button id="btnCopy">COPIER</button>
      <button class="ghost" id="btnAgain">REJOUER</button>
    </div>
  </div>
</div>

<script>
(() => {
  // ---------- Config ----------
  // Logical pixel resolution: fixed width, height follows the screen shape (fills tall phones).
  const W = 120;
  const H = Math.round(Math.max(180, Math.min(260, W * window.innerHeight / window.innerWidth)));
  const GOAL = 10;                   // obstacles to dodge
  const LIVES = 3;
  const ROAD_L = 22, ROAD_R = 98;    // road edges

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  canvas.width = W; canvas.height = H;
  ctx.imageSmoothingEnabled = false;

  const stage = document.getElementById('stage');
  function fit() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const scale = Math.min(vw / W, vh / H);
    stage.style.width = Math.floor(W * scale) + 'px';
    stage.style.height = Math.floor(H * scale) + 'px';
  }
  window.addEventListener('resize', fit);
  fit();

  // ---------- Pixel sprites ----------
  // Each sprite: array of strings, '.' = transparent, other chars map to palette.
  const PAL = {
    H: '#e2561f', h: '#a8340f', L: '#ff8a3d',      // hair (red/copper)
    S: '#f6c9a4', s: '#d9a27c',                    // skin
    T: '#2f9e6a', t: '#1f6e4a',                    // green jacket
    P: '#2c3a6b', B: '#1b1b22', W: '#ffffff',
    K: '#111118', G: '#9fd3ff', g: '#5e93bf',      // car glass
    R: '#d63a3a', r: '#8e2121', Y: '#ffd23a', y: '#c9961a',
    O: '#ff7a1a', o: '#b84e0c', A: '#7c8a96', a: '#4d5863',
    E: '#3a7d3a', e: '#255825', C: '#c7c7c7', c: '#8a8a8a',
    V: '#6b4ab3', v: '#432c78', N: '#8b5a2b',
  };

  // Girl, seen from behind, running up the street. Two frames.
  const GIRL_A = [
    '...LHHL...',
    '..LHHHHH..',
    '..HHHHHH..',
    '..HHHHHh..',
    '..hHHHHh..',
    '.sTHHHHTs.',
    '.STTHHTTS.',
    '.S.THHT.S.',
    '.S.THhT.S.',
    '...TThT...',
    '...TTTT...',
    '...PPPP...',
    '...PP.P...',
    '...PP.P...',
    '...BB.P...',
    '......B...',
  ];
  const GIRL_B = [
    '...LHHL...',
    '..HHHHHL..',
    '..HHHHHH..',
    '..hHHHHH..',
    '..hHHHHh..',
    '.sTHHHHTs.',
    '.STTHHTTS.',
    '.S.THHT.S.',
    '.S.ThHT.S.',
    '...ThTT...',
    '...TTTT...',
    '...PPPP...',
    '...P.PP...',
    '...P.PP...',
    '...P.BB...',
    '...B......',
  ];

  function car(body, dark) {
    return [
      '..KKKKKKKKKK..',
      '.K' + body.repeat(10) + 'K.',
      'K' + 'Y' + body.repeat(10) + 'Y' + 'K',
      'K' + body.repeat(12) + 'K',
      'K' + body + 'GGGGGGGGGG' + body + 'K',
      'K' + body + 'GGGGGGGGGG' + body + 'K',
      'K' + body + 'gGGGGGGGGg' + body + 'K',
      'K' + dark + body.repeat(10) + dark + 'K',
      'K' + dark + body.repeat(10) + dark + 'K',
      'K' + dark + body.repeat(10) + dark + 'K',
      'K' + dark + body.repeat(10) + dark + 'K',
      'K' + dark + body.repeat(10) + dark + 'K',
      'K' + dark + body.repeat(10) + dark + 'K',
      'K' + body + 'gggggggggg' + body + 'K',
      'K' + body + 'gGGGGGGGGg' + body + 'K',
      'K' + body.repeat(12) + 'K',
      'K' + 'R' + body.repeat(10) + 'R' + 'K',
      '.K' + body.repeat(10) + 'K.',
      '..KKKKKKKKKK..',
    ];
  }
  const CAR_RED = car('R', 'r');
  const CAR_TAXI = (() => {
    const c = car('Y', 'y');
    c[9] = 'Ky' + 'YKKKKKKKKY' + 'yK';
    c[10] = 'Ky' + 'YK' + 'YYYYYY' + 'KY' + 'yK';
    return c;
  })();
  const CAR_PURPLE = car('V', 'v');

  const CONE = [
    '...O...',
    '..OOO..',
    '..WWW..',
    '.OOOOO.',
    '.WWWWW.',
    'OOOOOOO',
    'ooooooo',
  ];
  const BIN = [
    '.aaaaaaaa.',
    'aEEEEEEEEa',
    'aeeeeeeeea',
    '.EeEEEEeE.',
    '.EeEEEEeE.',
    '.EeEEEEeE.',
    '.EeEEEEeE.',
    '.EeEEEEeE.',
    '.eeeeeeee.',
    '..K....K..',
  ];
  const BARRIER = [
    'K................K',
    'RRWWWRRRWWWRRRWWWR',
    'RWWWRRRWWWRRRWWWRR',
    'WWWRRRWWWRRRWWWRRR',
    'K................K',
    'K................K',
    'KK..............KK',
  ];
  const SCOOTER = [
    '...KK...',
    '..AAAA..',
    '...AA...',
    '...CC...',
    '..BBBB..',
    '..BRRB..',
    '..BRRB..',
    '..BRRB..',
    '...RR...',
    '...CC...',
    '...KK...',
    '...KK...',
  ];
  const PIGEONS = [
    '.c.......c..',
    'cAAc....cAAc',
    '.AAAc..cAAA.',
    '.aAA....aAA.',
    '..Y......Y..',
  ];

  const HEART = [
    '.RR.RR.',
    'RRRRRRR',
    'RRRRRRR',
    '.RRRRR.',
    '..RRR..',
    '...R...',
  ];

  // Pre-render sprites to offscreen canvases for speed.
  function bake(rows) {
    const c = document.createElement('canvas');
    c.width = rows[0].length; c.height = rows.length;
    const x = c.getContext('2d');
    rows.forEach((row, j) => {
      for (let i = 0; i < row.length; i++) {
        const ch = row[i];
        if (ch === '.') continue;
        x.fillStyle = PAL[ch]; x.fillRect(i, j, 1, 1);
      }
    });
    return c;
  }
  const SPR = {
    girlA: bake(GIRL_A), girlB: bake(GIRL_B),
    carRed: bake(CAR_RED), taxi: bake(CAR_TAXI), carPurple: bake(CAR_PURPLE),
    cone: bake(CONE), bin: bake(BIN), barrier: bake(BARRIER),
    scooter: bake(SCOOTER), pigeons: bake(PIGEONS), heart: bake(HEART),
  };

  const OBSTACLE_TYPES = [
    { spr: 'carRed', speed: 1.35 },
    { spr: 'taxi', speed: 1.35 },
    { spr: 'carPurple', speed: 1.35 },
    { spr: 'cone', speed: 1.0 },
    { spr: 'bin', speed: 1.0 },
    { spr: 'barrier', speed: 1.0 },
    { spr: 'scooter', speed: 1.55, wobble: true },
    { spr: 'pigeons', speed: 1.0, wobble: true },
  ];

  // ---------- City background (buildings scroll on both sides) ----------
  const BUILD_COLORS = ['#5b3a5e', '#3e4a7a', '#7a4a3a', '#4a6a5a', '#6a5a8a', '#8a6a3a'];
  function makeSide() {
    const blocks = [];
    let y = -40;
    while (y < H + 40) {
      const h = 26 + Math.floor(Math.random() * 30);
      blocks.push({ y, h, color: BUILD_COLORS[Math.floor(Math.random() * BUILD_COLORS.length)], lit: Math.random() });
      y += h + 2;
    }
    return blocks;
  }
  let leftSide = makeSide(), rightSide = makeSide();

  function drawSide(blocks, x0, w, facingRight) {
    for (const b of blocks) {
      ctx.fillStyle = b.color;
      ctx.fillRect(x0, Math.floor(b.y), w, b.h);
      // roof edge
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(x0, Math.floor(b.y), w, 2);
      // windows
      for (let wy = 5; wy < b.h - 4; wy += 7) {
        for (let wx = 3; wx < w - 3; wx += 5) {
          const lit = ((wx * 7 + wy * 13 + Math.floor(b.lit * 100)) % 5) < 2;
          ctx.fillStyle = lit ? '#ffd86b' : '#1d1830';
          ctx.fillRect(x0 + wx, Math.floor(b.y) + wy, 2, 3);
        }
      }
      // shop awning on some blocks
      if (b.lit > 0.6) {
        ctx.fillStyle = b.lit > 0.8 ? '#d63a3a' : '#2f9e6a';
        const ax = facingRight ? x0 + w - 3 : x0;
        ctx.fillRect(ax, Math.floor(b.y) + b.h - 10, 3, 8);
      }
    }
  }
  function scrollSide(blocks, dy) {
    for (const b of blocks) b.y += dy;
    // recycle
    while (blocks.length && blocks[blocks.length - 1].y > H + 4) blocks.pop();
    while (blocks[0].y > -30) {
      const h = 26 + Math.floor(Math.random() * 30);
      blocks.unshift({ y: blocks[0].y - h - 2, h, color: BUILD_COLORS[Math.floor(Math.random() * BUILD_COLORS.length)], lit: Math.random() });
    }
  }

  // ---------- Game state ----------
  let state = 'menu'; // menu | play | over | win
  let player, obstacles, dodged, lives, scroll, speed, spawnTimer, spawned, invuln, t, shake, particles, confetti;

  function reset() {
    player = { x: W / 2, y: H - 34, w: 10, h: 16, target: W / 2 };
    obstacles = [];
    particles = [];
    confetti = [];
    dodged = 0; lives = LIVES; scroll = 0; speed = 1.1;
    spawnTimer = 40; spawned = 0; invuln = 0; t = 0; shake = 0;
  }
  reset();

  // ---------- Input ----------
  function toLogicalX(clientX) {
    const r = canvas.getBoundingClientRect();
    return ((clientX - r.left) / r.width) * W;
  }
  let pointerDown = false;
  canvas.addEventListener('pointerdown', e => { pointerDown = true; player.target = toLogicalX(e.clientX); e.preventDefault(); });
  canvas.addEventListener('pointermove', e => { if (pointerDown || e.pointerType === 'mouse') player.target = toLogicalX(e.clientX); e.preventDefault(); });
  window.addEventListener('pointerup', () => { pointerDown = false; });
  window.addEventListener('pointercancel', () => { pointerDown = false; });
  const keys = {};
  window.addEventListener('keydown', e => {
    keys[e.key] = true;
    if ((e.key === ' ' || e.key === 'Enter') && state !== 'play') start();
  });
  window.addEventListener('keyup', e => { keys[e.key] = false; });
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

  // ---------- Tiny sound effects ----------
  let actx = null;
  function beep(freq, dur, type = 'square', vol = 0.06, slide = 0) {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = freq;
      if (slide) o.frequency.linearRampToValueAtTime(freq + slide, actx.currentTime + dur);
      g.gain.value = vol;
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g).connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (_) { /* audio unavailable */ }
  }
  function winJingle() {
    [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.18, 'square', 0.07), i * 130));
  }

  // ---------- Overlays ----------
  const $ = id => document.getElementById(id);
  function show(id) {
    ['start', 'over', 'win'].forEach(o => $(o).classList.toggle('show', o === id));
  }
  function start() {
    reset();
    state = 'play';
    show(null);
    beep(440, 0.08); setTimeout(() => beep(660, 0.1), 90);
  }
  $('btnStart').onclick = start;
  $('btnRetry').onclick = start;
  $('btnAgain').onclick = start;
  $('btnCopy').onclick = async () => {
    const btn = $('btnCopy');
    try {
      await navigator.clipboard.writeText('raphael_ger11');
      btn.textContent = 'COPIÉ !';
    } catch (_) {
      btn.textContent = 'raphael_ger11';
    }
    setTimeout(() => { btn.textContent = 'COPIER'; }, 1600);
  };

  // ---------- Spawning ----------
  function spawn() {
    const type = OBSTACLE_TYPES[Math.floor(Math.random() * OBSTACLE_TYPES.length)];
    const img = SPR[type.spr];
    const minX = ROAD_L + img.width / 2 + 1, maxX = ROAD_R - img.width / 2 - 1;
    // Bias spawn toward the player so the player has to actually move.
    let x = Math.random() < 0.55
      ? player.x + (Math.random() - 0.5) * 20
      : minX + Math.random() * (maxX - minX);
    x = Math.max(minX, Math.min(maxX, x));
    obstacles.push({
      x, y: -img.height, img, w: img.width, h: img.height,
      vy: type.speed, wobble: type.wobble ? Math.random() * 6.28 : null,
      passed: false, hit: false,
    });
    spawned++;
  }

  function burst(x, y, colors, n) {
    for (let i = 0; i < n; i++) {
      particles.push({
        x, y, vx: (Math.random() - 0.5) * 2.4, vy: (Math.random() - 0.8) * 2.2,
        life: 30 + Math.random() * 20, c: colors[Math.floor(Math.random() * colors.length)],
      });
    }
  }

  // ---------- Update ----------
  function update() {
    t++;
    const roadSpeed = state === 'play' ? speed : (state === 'win' ? 0.6 : 0.5);
    scroll = (scroll + roadSpeed) % 20;
    scrollSide(leftSide, roadSpeed);
    scrollSide(rightSide, roadSpeed);

    if (state === 'play') {
      // keyboard
      if (keys.ArrowLeft || keys.a || keys.q) player.target = player.x - 6;
      if (keys.ArrowRight || keys.d) player.target = player.x + 6;
      // move toward target with a max speed (keeps it fair & smooth)
      const half = player.w / 2;
      player.target = Math.max(ROAD_L + half, Math.min(ROAD_R - half, player.target));
      const dx = player.target - player.x;
      player.x += Math.sign(dx) * Math.min(Math.abs(dx), 2.4);

      // spawn until enough obstacles are in play to reach the goal
      const pending = obstacles.filter(o => !o.passed && !o.hit).length;
      spawnTimer--;
      if (spawnTimer <= 0 && dodged + pending < GOAL) {
        spawn();
        spawnTimer = Math.max(34, 70 - dodged * 3.5) + Math.random() * 20;
      }
      speed = 1.1 + dodged * 0.09;

      for (const o of obstacles) {
        o.y += (o.vy * speed);
        if (o.wobble !== null) { o.wobble += 0.08; o.x += Math.sin(o.wobble) * 0.4; }

        // collision (slightly forgiving hitbox)
        if (!o.hit && !o.passed && invuln <= 0) {
          const px = player.x - player.w / 2 + 2, py = player.y + 3, pw = player.w - 4, ph = player.h - 4;
          const ox = o.x - o.w / 2 + 1, oy = o.y + 1, ow = o.w - 2, oh = o.h - 2;
          if (px < ox + ow && px + pw > ox && py < oy + oh && py + ph > oy) {
            o.hit = true;
            lives--;
            invuln = 70; shake = 10;
            burst(player.x, player.y + 6, ['#ffffff', '#ff7a2f', '#ffd23a'], 14);
            beep(160, 0.25, 'sawtooth', 0.08, -90);
            if (navigator.vibrate) navigator.vibrate(120);
            if (lives <= 0) {
              state = 'over';
              $('overText').innerHTML = 'Tu as esquivé<br>' + dodged + ' / ' + GOAL;
              setTimeout(() => show('over'), 500);
            }
          }
        }
        if (!o.passed && !o.hit && o.y > player.y + player.h) {
          o.passed = true;
          dodged++;
          burst(player.x, player.y - 2, ['#ffd23a', '#9fd3ff'], 6);
          beep(880 + dodged * 40, 0.07, 'square', 0.05);
          if (dodged >= GOAL) {
            state = 'win';
            winJingle();
            for (let i = 0; i < 80; i++) {
              confetti.push({
                x: Math.random() * W, y: -Math.random() * H,
                vy: 0.6 + Math.random() * 1.2, vx: (Math.random() - 0.5) * 0.6,
                c: ['#ff7a2f', '#ffd23a', '#2f9e6a', '#9fd3ff', '#ff5fa2', '#fffc00'][i % 6],
              });
            }
            setTimeout(() => show('win'), 900);
          }
        }
      }
      obstacles = obstacles.filter(o => o.y < H + 30);
      if (invuln > 0) invuln--;
    } else if (state === 'win') {
      for (const o of obstacles) o.y += o.vy * speed;
      // little victory dance
      player.x += (W / 2 - player.x) * 0.05;
    }

    for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.life--; }
    particles = particles.filter(p => p.life > 0);
    for (const c of confetti) { c.x += c.vx + Math.sin((t + c.y) * 0.05) * 0.3; c.y += c.vy; if (c.y > H) c.y -= H + 10; }
    if (shake > 0) shake--;
  }

  // ---------- Render ----------
  function drawText(str, x, y, color, align = 'left') {
    ctx.font = '8px "Press Start 2P", monospace';
    ctx.textAlign = align; ctx.textBaseline = 'top';
    ctx.fillStyle = '#000'; ctx.fillText(str, x + 1, y + 1);
    ctx.fillStyle = color; ctx.fillText(str, x, y);
  }

  function render() {
    ctx.save();
    if (shake > 0) ctx.translate(Math.round((Math.random() - 0.5) * 4), Math.round((Math.random() - 0.5) * 4));

    // sidewalks
    ctx.fillStyle = '#8a8496'; ctx.fillRect(0, 0, W, H);
    for (let y = -20 + Math.floor(scroll); y < H; y += 10) {
      ctx.fillStyle = '#7a7486';
      ctx.fillRect(14, y, ROAD_L - 14, 1);
      ctx.fillRect(ROAD_R, y, W - ROAD_R - 14, 1);
    }
    // buildings
    drawSide(leftSide, 0, 14, true);
    drawSide(rightSide, W - 14, 14, false);

    // road
    ctx.fillStyle = '#3b3846'; ctx.fillRect(ROAD_L, 0, ROAD_R - ROAD_L, H);
    // curbs
    ctx.fillStyle = '#c9c2d4'; ctx.fillRect(ROAD_L - 2, 0, 2, H); ctx.fillRect(ROAD_R, 0, 2, H);
    // lane dashes
    ctx.fillStyle = '#e8e2c8';
    const laneW = (ROAD_R - ROAD_L) / 3;
    for (let y = -20 + Math.floor(scroll); y < H; y += 20) {
      ctx.fillRect(Math.round(ROAD_L + laneW) - 1, y, 2, 9);
      ctx.fillRect(Math.round(ROAD_L + laneW * 2) - 1, y, 2, 9);
    }
    // street lamps on sidewalks
    for (let y = -40 + Math.floor((scroll * 2) % 40); y < H; y += 80) {
      ctx.fillStyle = '#2a2638'; ctx.fillRect(17, y, 2, 2); ctx.fillRect(W - 19, y + 40, 2, 2);
      ctx.fillStyle = 'rgba(255,216,107,0.25)';
      ctx.fillRect(15, y - 2, 6, 6); ctx.fillRect(W - 21, y + 38, 6, 6);
    }

    // obstacles
    for (const o of obstacles) {
      ctx.globalAlpha = o.hit ? 0.5 : 1;
      ctx.drawImage(o.img, Math.round(o.x - o.w / 2), Math.round(o.y));
    }
    ctx.globalAlpha = 1;

    // player
    if (!(invuln > 0 && Math.floor(invuln / 4) % 2 === 0)) {
      const frame = (state === 'play' && Math.floor(t / 8) % 2) ? SPR.girlB : SPR.girlA;
      const bob = state === 'win' ? -Math.abs(Math.round(Math.sin(t * 0.15) * 4)) : 0;
      // shadow
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillRect(Math.round(player.x - 4), Math.round(player.y + 15), 8, 2);
      ctx.drawImage(frame, Math.round(player.x - player.w / 2), Math.round(player.y + bob));
    }

    // particles
    for (const p of particles) { ctx.fillStyle = p.c; ctx.fillRect(Math.round(p.x), Math.round(p.y), 1, 1); }
    for (const c of confetti) { ctx.fillStyle = c.c; ctx.fillRect(Math.round(c.x), Math.round(c.y), 2, 2); }

    ctx.restore();

    // HUD
    if (state !== 'menu') {
      ctx.fillStyle = 'rgba(20,16,32,0.7)'; ctx.fillRect(0, 0, W, 14);
      for (let i = 0; i < LIVES; i++) {
        ctx.globalAlpha = i < lives ? 1 : 0.25;
        ctx.drawImage(SPR.heart, 3 + i * 9, 4);
      }
      ctx.globalAlpha = 1;
      drawText(dodged + '/' + GOAL, W - 3, 4, '#ffd23a', 'right');
      // progress bar
      ctx.fillStyle = '#2a2340'; ctx.fillRect(0, 14, W, 2);
      ctx.fillStyle = '#ff7a2f'; ctx.fillRect(0, 14, Math.round(W * dodged / GOAL), 2);
    }
  }

  // Fixed-timestep loop (60 updates/sec regardless of screen refresh rate)
  let last = performance.now(), acc = 0;
  function loop(now) {
    acc += Math.min(100, now - last);
    last = now;
    while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
